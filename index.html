
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldie Battle</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101a25;color:white;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
.hud{position:fixed;inset:0;pointer-events:none;padding:20px}
.logo{font-size:27px;font-weight:900;color:#ffd34d;text-shadow:0 2px 12px #000}
.subtitle{font-size:10px;letter-spacing:4px;color:#fff}
.profile{position:absolute;top:20px;right:20px;background:#111c2bdc;padding:12px 18px;border:1px solid #d9a933;border-radius:12px}
.bottom{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px;pointer-events:auto}
button{border:1px solid #f3c34b;background:#18283c;color:white;padding:15px 23px;border-radius:9px;font-weight:bold;letter-spacing:1px}
button.primary{background:linear-gradient(120deg,#ffe27a,#d99117);color:#171717;font-size:17px}
button:active{transform:scale(.96)}
#message{position:absolute;bottom:105px;left:0;right:0;text-align:center;color:#ffe49b;font-size:14px;text-shadow:0 2px 5px black}
#loading{position:fixed;inset:0;background:#101a25;display:grid;place-items:center;z-index:5;font-size:20px;color:#ffd34d}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">GOLDIE BATTLE<br>LOADING...</div>
<div class="hud">
  <div class="logo">GOLDIE BATTLE</div>
  <div class="subtitle">ENTER THE NEXT LEVEL</div>
  <div class="profile">PLAYER 01<br><span style="color:#ffd34d">LEVEL 1</span></div>
  <div id="message">WELCOME TO GOLDIE BATTLE</div>
  <div class="bottom">
    <button onclick="showMessage('CHARACTER CUSTOMIZATION COMING SOON')">CHARACTER</button>
    <button onclick="showMessage('TRAINING AREA SELECTED')">TRAINING</button>
    <button class="primary" onclick="showMessage('YOUR ADVENTURE IS COMING SOON!')">START GAME</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91b7c9);
scene.fog = new THREE.Fog(0x91b7c9,35,110);

const camera = new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
camera.position.set(0,5,13);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x52634b,2));
const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(-8,15,8);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x526c48})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function box(x,y,z,w,h,d,color){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color})
 );
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 scene.add(m);return m;
}

// Training plaza
box(0,.05,0,24,.12,18,0x737b7a);
box(0,.13,0,15,.04,10,0x9b9b8a);

// Buildings
function building(x,z,color){
 box(x,2,z,5,4,5,color);
 box(x,4.15,z,5.4,.3,5.4,0x343b43);
 box(x,1.3,z+2.53,1.2,2.5,0x283b50);
 box(x-1.5,2.5,z+2.55,1.1,1,0x80bbd0);
 box(x+1.5,2.5,z+2.55,1.1,1,0x80bbd0);
}
building(-10,-8,0x9c8065);
building(10,-9,0x687f91);
building(-13,8,0x8b967c);
building(13,8,0x9c8065);

// Trees
function tree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.22,.35,2,8),
  new THREE.MeshStandardMaterial({color:0x67452b})
 );
 trunk.position.set(x,1,z);scene.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(1.35,12,10),
  new THREE.MeshStandardMaterial({color:0x285e38})
 );
 leaves.position.set(x,2.8,z);leaves.castShadow=true;scene.add(leaves);
}
for(let i=0;i<18;i++){
 tree((i%6-3)*7-17,Math.floor(i/6)*12-10);
}

// Goldie Battle character
const hero=new THREE.Group();
scene.add(hero);

const gold=new THREE.MeshStandardMaterial({color:0xe5ad32,metalness:.45,roughness:.35});
const dark=new THREE.MeshStandardMaterial({color:0x24364b,roughness:.6});
const white=new THREE.MeshStandardMaterial({color:0xe9edf0});
const visor=new THREE.MeshStandardMaterial({color:0x64d9ef,metalness:.5,roughness:.2});

function part(parent,geometry,material,x,y,z){
 const m=new THREE.Mesh(geometry,material);
 m.position.set(x,y,z);m.castShadow=true;
 parent.add(m);return m;
}

part(hero,new THREE.CylinderGeometry(.43,.5,1.15,16),dark,0,1.25,0);
part(hero,new THREE.SphereGeometry(.43,20,16),gold,0,2.15,0);
part(hero,new THREE.BoxGeometry(.65,.23,.08),visor,0,2.18,.38);
part(hero,new THREE.BoxGeometry(.28,.8,.3),gold,-.55,1.3,0);
part(hero,new THREE.BoxGeometry(.28,.8,.3),gold,.55,1.3,0);
part(hero,new THREE.BoxGeometry(.32,.8,.38),dark,-.25,.4,0);
part(hero,new THREE.BoxGeometry(.32,.8,.38),dark,.25,.4,0);
part(hero,new THREE.BoxGeometry(.95,.16,.55),gold,0,1.85,0);
hero.position.set(0,0,2);

// Decorative lights
for(let i=0;i<4;i++){
 const lamp=new THREE.PointLight(0xffc64a,15,7);
 lamp.position.set((i-1.5)*5,3,-2);
 scene.add(lamp);
 box((i-1.5)*5,.15,-2,.18,2,.18,0xffd35a);
}

// Camera and animation
let clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 hero.position.y=Math.sin(t*2)*.045;
 hero.rotation.y=Math.sin(t*.5)*.12;
 camera.position.x=Math.sin(t*.12)*.35;
 camera.lookAt(0,1.6,0);
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
document.getElementById("loading").style.display="none";
window.showMessage=(msg)=>{
 document.getElementById("message").textContent=msg;
};
</script>
</body>
</html>
